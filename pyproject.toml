[project]
name = "alvenir_grpc_contracts"
version = "0.0.3"
description = "Generated gRPC python files for interacting with Alvenir Services"
requires-python = ">=3.10"
dependencies = [
    "grpcio>=1.73.1",
    "protobuf>=6.31.1",
]
authors = [
  { name = "Moesen", email = "gustav@alvenir.ai" }
]
readme = "README.md"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "grpcio-tools>=1.73.1",
]

[[tool.uv.index]]
name = "alvenir-grpc-contracts"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[project.urls]
Homepage = "https://github.com/alvenirai/alvenir-grpc-contracts"
Issues = "https://github.com/alvenirai/alvenir-grpc-contracts/issues"
